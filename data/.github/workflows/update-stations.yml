name: Update railway stations

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pymupdf

      - name: Download and process OSJD station lists
        run: |
          python scripts/update_stations.py

      - name: Save updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/stations.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update railway stations from OSJD"
            git push
          fi
