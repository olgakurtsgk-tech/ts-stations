name: Update railway stations

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  update-stations:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pymupdf


      # ============================================================
      # 4. ENVIRONMENT
      # ============================================================

      - name: Show environment
        run: |
          echo "========================================"
          echo "ENVIRONMENT"
          echo "========================================"

          python --version
          pip --version

          python -c "import fitz; print('PyMuPDF:', fitz.version)"


      # ============================================================
      # 5. DEBUG PDF
      # ============================================================

      - name: Debug PDF parser
        run: |
          echo "========================================"
          echo "DEBUG PDF PARSER"
          echo "========================================"

          python scripts/debug_pdf.py


      # ============================================================
      # 6. UPDATE DATABASE
      # ============================================================

      - name: Update stations database
        run: |
          echo "========================================"
          echo "UPDATING STATIONS DATABASE"
          echo "========================================"

          python scripts/update_stations.py


      # ============================================================
      # 7. VALIDATE DATABASE
      # ============================================================

      - name: Validate stations database
        run: |
          echo "========================================"
          echo "VALIDATING STATIONS DATABASE"
          echo "========================================"

          python scripts/validate_stations.py


      # ============================================================
      # 8. CHECK OSJD COUNTRIES
      # ============================================================

      - name: Check OSJD countries
        run: |
          echo "========================================"
          echo "CHECKING OSJD COUNTRIES"
          echo "========================================"

          python scripts/check_countries.py


      # ============================================================
      # 9. CHECK JSON
      # ============================================================

      - name: Check stations JSON
        run: |
          echo "========================================"
          echo "CHECKING stations.json"
          echo "========================================"

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/stations.json")

          if not path.exists():
              raise SystemExit(
                  "ERROR: data/stations.json not found"
              )

          with path.open(
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          if not isinstance(data, list):
              raise SystemExit(
                  "ERROR: stations.json must contain a JSON array"
              )

          print(
              f"JSON records: {len(data)}"
          )

          print(
              f"File size: {path.stat().st_size:,} bytes"
          )

          if len(data) < 1000:
              raise SystemExit(
                  f"ERROR: too few stations: {len(data)}"
              )

          print(
              "OK: stations.json looks valid"
          )
          PY


      # ============================================================
      # 10. STATION STATISTICS
      # ============================================================

      - name: Show station statistics
        run: |
          echo "========================================"
          echo "STATION STATISTICS"
          echo "========================================"

          python - <<'PY'
          import json
          from collections import Counter

          with open(
              "data/stations.json",
              "r",
              encoding="utf-8"
          ) as f:
              stations = json.load(f)

          countries = Counter(
              station.get(
                  "country",
                  "UNKNOWN"
              )
              for station in stations
          )

          country_codes = Counter(
              station.get(
                  "country_code",
                  "UNKNOWN"
              )
              for station in stations
          )

          print()
          print(
              f"TOTAL STATIONS: {len(stations):,}"
          )

          print()
          print(
              "STATIONS BY COUNTRY"
          )

          print(
              "----------------------------------------"
          )

          for country, count in sorted(
              countries.items(),
              key=lambda x: (-x[1], x[0])
          ):
              print(
                  f"{country}: {count:,}"
              )

          print()
          print(
              "COUNTRY CODES"
          )

          print(
              "----------------------------------------"
          )

          for code, count in sorted(
              country_codes.items()
          ):
              print(
                  f"{code}: {count:,}"
              )

          print()
          print(
              "FIRST 10 RECORDS"
          )

          print(
              "----------------------------------------"
          )

          for number, station in enumerate(
              stations[:10],
              start=1
          ):
              print(
                  f"{number}. "
                  f"{station.get('name')} | "
                  f"{station.get('code')} | "
                  f"{station.get('country')}"
              )
          PY


      # ============================================================
      # 11. CHECK STATION CODES
      # ============================================================

      - name: Check station codes
        run: |
          echo "========================================"
          echo "CHECKING STATION CODES"
          echo "========================================"

          python - <<'PY'
          import json
          import re

          with open(
              "data/stations.json",
              "r",
              encoding="utf-8"
          ) as f:
              stations = json.load(f)

          invalid = []

          for station in stations:

              code = str(
                  station.get(
                      "code",
                      ""
                  )
              )

              if not re.fullmatch(
                  r"\d{6}",
                  code
              ):
                  invalid.append(station)

          print(
              f"Total stations: {len(stations):,}"
          )

          print(
              f"Invalid station codes: {len(invalid)}"
          )

          if invalid:

              print()
              print(
                  "FIRST INVALID RECORDS"
              )

              print(
                  "----------------------------------------"
              )

              for station in invalid[:20]:

                  print(
                      f"{station.get('name')} "
                      f"| {station.get('code')} "
                      f"| {station.get('country')}"
                  )

              raise SystemExit(
                  "ERROR: invalid station codes found"
              )

          print()
          print(
              "OK: all station codes have 6 digits"
          )
          PY


      # ============================================================
      # 12. GIT STATUS
      # ============================================================

      - name: Check git changes
        run: |
          echo "========================================"
          echo "GIT STATUS"
          echo "========================================"

          git status --short


      # ============================================================
      # 13. COMMIT DATABASE
      # ============================================================

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/stations.json

          if git diff --cached --quiet; then

            echo "No changes to stations.json"

          else

            git commit -m "Update railway stations database"

            git push

            echo "========================================"
            echo "DATABASE UPDATED"
            echo "========================================"

          fi
