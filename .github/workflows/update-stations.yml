name: Update railway stations database

on:
  schedule:
    # 1-е число каждого месяца, 03:00 UTC
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stations
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install PyMuPDF requests beautifulsoup4
          fi

      - name: Show environment
        run: |
          python --version
          pip list | grep -Ei 'pymupdf|requests|beautifulsoup' || true

      - name: Update stations database
        run: python scripts/update_stations.py

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- data/stations.json; then
            echo "No changes in data/stations.json, nothing to commit."
            exit 0
          fi

          git add data/stations.json
          git commit -m "Update stations database [$(date -u +%Y-%m-%d)]"
          git push
