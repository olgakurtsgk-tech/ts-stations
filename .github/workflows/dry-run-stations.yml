name: Dry run station parser

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 pymupdf

      - name: Compile parser and dry-run script
        run: |
          python -m py_compile scripts/update_stations.py
          python -m py_compile scripts/dry_run_stations.py

      - name: Run dry parser test (does not write stations.json)
        run: |
          python scripts/dry_run_stations.py --report /tmp/stations-dry-run-report.json

      - name: Upload dry-run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stations-dry-run-report
          path: /tmp/stations-dry-run-report.json
          if-no-files-found: warn
          retention-days: 14
