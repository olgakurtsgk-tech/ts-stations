
name: Audit station names

"on":
  workflow_dispatch:
  push:
    paths:
      - "scripts/audit_station_names.py"
      - "data/stations.json"
      - ".github/workflows/audit-station-names.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run station name audit
        run: python scripts/audit_station_names.py

      - name: Save audit report
        run: |
          if [ -f station_name_audit.txt ]; then
            git add station_name_audit.txt
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Update station name audit report"
              git push
            fi
          else
            echo "Audit report was not created"
            exit 1
          fi

