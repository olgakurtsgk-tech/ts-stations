
name: Test station name validation

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_stations.py"
      - "tests/test_station_name_validation.py"
      - ".github/workflows/test-station-name-validation.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf requests beautifulsoup4

      - name: Run station name tests
        run: python -m unittest discover -s tests -v
